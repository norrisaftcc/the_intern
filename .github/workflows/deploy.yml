name: Deploy AlgoCratic Futures

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        cd projects/algocratic-futures/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
    
    # The gate, run the way the gate is written.
    #
    # This step ran `pytest tests/` against a directory that has never existed
    # in this repository, so it exited 4 - a usage error, not a test result -
    # on every run it ever reached. It could not reach many: deploy.yml spent
    # about a year at a path Actions does not read, and before that
    # requirements.txt pinned adventurelib==2.0.0, which was never published.
    # Three obstacles in series, each hiding the next. See TESTING.md.
    #
    # Pytest was never going to work here regardless of the path. These files
    # contain zero `def test_*` functions; the one `class Test*` is
    # `TestResult`, a dataclass pytest declines to collect. They are scripts
    # with a main() that returns a pass/fail, which is the convention
    # CLAUDE.md documents. Pointing pytest at the right directory would have
    # moved exit 4 to exit 5 - "no tests collected" - and told nobody anything.
    #
    # test_trigger.py is not in this list. It is three comment lines with no
    # code, written to poke the review workflow into running. It is named
    # test_* and it is not a test.
    - name: Run the backend gate
      run: |
        set -euo pipefail
        cd projects/algocratic-futures/backend
        for gate in test_agent_tiers.py test_liza_flash_compatibility.py; do
          echo "::group::$gate"
          python "$gate"
          echo "::endgroup::"
        done
    
    - name: Check clearance system integrity
      run: |
        cd projects/algocratic-futures/backend
        python -c "from clearance_system import ClearanceLevel; assert ClearanceLevel.UV == 9"

  # STUB. This job does not run and did not work when it did. Kept as a record
  # of intent, disabled so it stops reporting a failure it cannot fix.
  #
  # It ran 7 times on main between 2025-08-20 and 2026-07-31 and failed 7
  # times, every one of them on the first step:
  #
  #   ERROR: failed to build: failed to solve: failed to read dockerfile:
  #          open Dockerfile: no such file or directory
  #
  # There is no Dockerfile in this repository and there never has been. The
  # step behind it, which therefore never executed once, was two echoes -
  # `echo "Deployment would happen here"`. So the job could not build, and
  # would have deployed nothing if it had. Both halves are preserved below,
  # unedited, because a stub that quietly tidies up what it is stubbing
  # destroys the evidence of what was actually here.
  #
  # WHY THIS IS DISABLED RATHER THAN DELETED: nobody has claimed a deploy
  # target. Deleting says there will never be one; leaving it live says there
  # is one today. `if: false` says what is true - it was intended, it does not
  # work, and the decision is open. Delete this job if the answer turns out to
  # be no.
  #
  # WHY IT MATTERS THAT IT WAS RED: main carried a failing check continuously
  # for a year. A default branch that is always red teaches every reader that
  # red on main means nothing, which is the condition under which
  # ai-code-review.yml reported success for a year with nobody looking. The
  # broken deploy did not cause that; it removed the signal that would have
  # caught it. Turning main green is the point of this change, not a side
  # effect of it.
  #
  # TO REVIVE, in this order:
  #   1. write projects/algocratic-futures/Dockerfile
  #   2. replace the echo step with a deployment that deploys
  #   3. restore `if: github.ref == 'refs/heads/main'`
  #   4. check `needs: test` still expresses what you want - it is inert while
  #      this job is disabled, and it is the kind of edge that gets read as
  #      load-bearing because it survived
  #
  # The order matters. Restoring the trigger first gets a red main back.
  # Fixing only the Dockerfile makes a job that deploys nothing report success,
  # which is worse than the failure it replaced.
  #
  # This list is duplicated in #39 on purpose. A revival procedure that lives
  # only in a comment attached to the job it describes disappears the moment
  # someone deletes the job, which is one of the two outcomes this stub is
  # waiting on.
  deploy:
    needs: test  # inert while `if: false`; re-check this at revival (step 4)
    runs-on: ubuntu-latest
    if: false  # was: github.ref == 'refs/heads/main'  — see the block above and #39

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: |
        cd projects/algocratic-futures
        docker build -t algocratic-futures:latest .

    - name: Deploy to production
      run: |
        echo "Deployment would happen here"
        echo "Remember: The Algorithm is watching"