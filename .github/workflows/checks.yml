# The repository's own checks, wired in.
#
# Both of these existed and neither ran. `floor_test.py` gates the whole CSI
# persona roster and has been cited as verification in pull request after pull
# request while only ever being run by hand. `extraction_test.py` was written
# to catch a guard-disarm that had already nearly happened once, and was
# committed without anything to invoke it.
#
# That is the failure this repository has been documenting all along: a check
# that exists, looks like coverage, and never executes. `agent_tier_tests.yml`
# filtered on paths that do not exist and was deleted on 2026-07-31 having
# never triggered once. `deploy.yml` spent a year at a path Actions does not
# read. `ai-code-review.yml` reported success for a year without producing a
# review. This file is the same defect, caught in our own hands rather than in
# the archive.
#
# Deliberately separate from `deploy.yml`. That workflow carries an unresolved
# question about what the backend gate is; these two checks are settled and
# should not wait on it.

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is here because a review asked whether these files still import
        # on it and the honest answer was that nothing checked. `test (3.9)`
        # runs pytest inside projects/algocratic-futures/backend and never
        # touches tests/csi/ at all, so the compatibility claim was reasoning
        # rather than evidence. fail-fast is off so one version failing does
        # not hide the other's result.
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Both tests are standard library only, by design. No pip step, nothing
      # to pin, nothing to go stale. `jq` is present on ubuntu-latest and the
      # extraction test now fails rather than skips if it ever is not.
      - name: jq is available
        run: jq --version

      # A workflow file outside .github/workflows/ at the repository root is
      # inert - Actions does not read it. That is a path convention, not a
      # guarantee, and this repository has been bitten by it twice. deploy.yml
      # sat at projects/algocratic-futures/.github/workflows/ for about a year
      # and went live the moment it moved. A duplicate ai-code-review.yml sat
      # beside it holding an injectable heredoc until it was deleted.
      #
      # Both were found by reading history. This finds the next one on the
      # commit that adds it.
      #
      # SCOPE, so nobody later mistakes this for more than it is: this checks
      # directory *depth*, not workflow hygiene generally. A file at
      # .github/workflows-old/ or .Github/workflows/ is not flagged. The threat
      # it closes is "Actions will read this the moment someone moves it",
      # which is a question about where the file sits, not what it contains.
      #
      # Placed before the test steps deliberately. A stray workflow is a
      # higher-severity finding than a failing unit test, and seeing it first
      # is worth losing the downstream feedback in that run.
      - name: Fail on workflow files outside the repository root
        run: |
          set -euo pipefail

          # STRAY_PATHSPEC_START
          # tests/workflow/stray_workflow_test.py reads the pathspec from
          # between these markers and exercises it against a real repository.
          # It reads the live value rather than holding a copy, because a test
          # with its own stale copy passes while the guard it protects
          # degrades - which is the failure this whole step exists to prevent,
          # committed one directory over.
          STRAY_PATHSPEC='*/.github/workflows/*'
          # STRAY_PATHSPEC_END

          stray=$(git ls-files "$STRAY_PATHSPEC")
          if [ -n "$stray" ]; then
            echo "::error::Workflow files tracked outside .github/workflows/ at the root."
            echo "$stray"
            echo "Actions does not read these. They are inert until someone moves"
            echo "them, and then they are live with whatever they contain."
            exit 1
          fi
          echo "No workflow files outside the repository root."

      - name: CSI floor test
        run: python3 tests/csi/floor_test.py

      - name: Case-file lint does not have the bug it lints for
        run: python3 tests/csi/lint_test.py

      - name: Documented examples match their cases
        run: python3 tests/csi/examples_test.py

      - name: Review extraction guard
        run: python3 tests/workflow/extraction_test.py

      - name: Stray-workflow pathspec behaves
        run: python3 tests/workflow/stray_workflow_test.py

      - name: Kevin's write scope is enforced, not promised
        run: python3 tests/workflow/kevin_scope_test.py
